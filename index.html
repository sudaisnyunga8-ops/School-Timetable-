<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudais's Vaporwave Mint Timetable</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vapor: {
              bg: '#05020a',
              surface: '#0f071c',
              border: 'rgba(168, 85, 247, 0.2)',
              mint: '#00ffcc',
              mintGlow: 'rgba(0, 255, 204, 0.4)',
              violet: '#a855f7',
              pink: '#ec4899',
              cyan: '#38bdf8'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #15092a 0%, #05020a 70%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-vapor {
      background: rgba(15, 7, 28, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 204, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-mint {
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
    }
    .glow-violet {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28 selection:bg-[#00ffcc] selection:text-black">

  <header class="sticky top-0 z-50 glass-vapor border-b border-[#00ffcc]/20 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-[#00ffcc] via-[#38bdf8] to-[#a855f7] p-0.5 shadow-lg glow-mint flex items-center justify-center">
          <div class="w-full h-full bg-[#05020a] rounded-[14px] flex items-center justify-center font-black text-[#00ffcc] text-sm tracking-wider">SN</div>
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white tracking-wide">Sudais Nyunga</h1>
          <p class="text-[11px] text-[#00ffcc] font-medium">Group 4D1 • Stage S4</p>
        </div>
      </div>
      <div class="glass-pill px-3 py-1.5 rounded-xl text-right border-[#00ffcc]/20">
        <span class="text-[9px] uppercase tracking-widest text-slate-400 block font-bold">Current Time</span>
        <span id="header-clock" class="text-xs font-mono font-bold text-[#00ffcc]">00:00:00</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <div class="glass-vapor rounded-2xl p-4 mb-4 border border-[#00ffcc]/30 bg-gradient-to-r from-[#00ffcc]/10 via-[#a855f7]/10 to-[#ec4899]/10 shadow-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-[#00ffcc]/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="flex items-center justify-between relative z-10">
        <div>
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="w-2 h-2 rounded-full bg-[#00ffcc] animate-pulse"></span>
            <span id="status-badge" class="text-[10px] font-extrabold uppercase tracking-widest text-[#00ffcc]">Live Period Status</span>
          </div>
          <h3 id="current-class-title" class="text-xs font-bold text-white">Loading schedule...</h3>
        </div>
        <div class="text-right">
          <span class="text-[9px] uppercase tracking-widest text-slate-400 block font-bold">Time Remaining</span>
          <span id="period-countdown" class="text-sm font-mono font-black text-[#a855f7]">--:--</span>
        </div>
      </div>
    </div>

    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-4">
      <button onclick="switchDay('Monday')" id="tab-Monday" class="day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap bg-[#00ffcc] text-black shadow-lg shadow-[#00ffcc]/20">Monday</button>
      <button onclick="switchDay('Tuesday')" id="tab-Tuesday" class="day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap glass-pill text-slate-400 hover:text-white">Tuesday</button>
      <button onclick="switchDay('Wednesday')" id="tab-Wednesday" class="day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap glass-pill text-slate-400 hover:text-white">Wednesday</button>
      <button onclick="switchDay('Thursday')" id="tab-Thursday" class="day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap glass-pill text-slate-400 hover:text-white">Thursday</button>
      <button onclick="switchDay('Friday')" id="tab-Friday" class="day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap glass-pill text-slate-400 hover:text-white">Friday</button>
    </div>

    <div class="flex items-center justify-between mb-4 px-1">
      <div>
        <h2 id="active-day-title" class="text-base font-extrabold text-white tracking-tight">Monday Timeline</h2>
        <span id="active-day-count" class="text-xs text-slate-400 font-medium">9 periods scheduled</span>
      </div>
      <div class="glass-pill px-3 py-1 rounded-full text-[10px] font-mono text-[#00ffcc] font-bold border border-[#00ffcc]/20 bg-[#00ffcc]/10">
        ACTIVE
      </div>
    </div>

    <div id="timeline-container" class="space-y-3">
      <!-- Injected via JavaScript -->
    </div>

  </main>

  <nav class="fixed bottom-4 left-4 right-4 max-w-md mx-auto glass-vapor rounded-2xl p-2 flex items-center justify-around shadow-2xl z-50 border border-[#00ffcc]/20">
    <button onclick="switchView('timetable')" id="nav-timetable" class="flex flex-col items-center gap-1 text-[#00ffcc] py-1.5 px-6 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span class="text-[10px] font-bold tracking-wide">Timetable</span>
    </button>
    <button onclick="switchView('bells')" id="nav-bells" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white py-1.5 px-6 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="text-[10px] font-bold tracking-wide">Bell Times</span>
    </button>
  </nav>

  <script>
    const fullSchedule = {
      Monday: [
        { time: '08:50 - 09:40', period: 'Period 1', name: 'English – CfE', teacher: 'Mr McGeary', room: 'F12', type: 'class' },
        { time: '09:40 - 10:25', period: 'Period 2', name: 'Physical Education – CfE', teacher: 'Mr McLarty', room: 'P/E', type: 'class' },
        { time: '10:25 - 11:10', period: 'Period 3', name: 'Personal & Social Education', teacher: 'Ms Looker', room: 'S15', type: 'class' },
        { time: '11:10 - 11:25', period: 'Break', name: 'Morning Break', teacher: 'Cafeteria', room: 'Break', type: 'break' },
        { time: '11:25 - 12:15', period: 'Period 4', name: 'Biology – CfE', teacher: 'Mrs Cullen', room: 'S4', type: 'class' },
        { time: '12:15 - 13:05', period: 'Period 5', name: 'Administration – CfE', teacher: 'Miss Kennedy', room: 'F22', type: 'class' },
        { time: '13:05 - 13:45', period: 'Lunch', name: 'Lunch Break', teacher: 'Dining Hall', room: 'Break', type: 'break' },
        { time: '13:45 - 14:30', period: 'Period 6', name: 'Mathematics – CfE', teacher: 'Mr McLarty', room: 'F3', type: 'class' },
        { time: '14:30 - 15:15', period: 'Period 7', name: 'Modern Studies – CfE', teacher: 'Mr Kelly', room: 'S23', type: 'class' }
      ],
      Tuesday: [
        { time: '08:50 - 09:40', period: 'Period 1', name: 'Mathematics – CfE', teacher: 'Mr McLarty', room: 'F3', type: 'class' },
        { time: '09:40 - 10:25', period: 'Period 2', name: 'Biology – CfE', teacher: 'Mrs Cullen', room: 'S4', type: 'class' },
        { time: '10:25 - 11:10', period: 'Period 3', name: 'English – CfE', teacher: 'Mr McGeary', room: 'F12', type: 'class' },
        { time: '11:10 - 11:25', period: 'Break', name: 'Morning Break', teacher: 'Cafeteria', room: 'Break', type: 'break' },
        { time: '11:25 - 12:15', period: 'Period 4', name: 'Administration – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '12:15 - 13:05', period: 'Period 5', name: 'Physical Education – CfE', teacher: 'Mr McGimpsey', room: 'P/E', type: 'class' },
        { time: '13:05 - 13:45', period: 'Lunch', name: 'Lunch Break', teacher: 'Dining Hall', room: 'Break', type: 'break' },
        { time: '13:45 - 14:30', period: 'Period 6', name: 'Business Management – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '14:30 - 15:15', period: 'Period 7', name: 'Business Management – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' }
      ],
      Wednesday: [
        { time: '08:50 - 09:40', period: 'Period 1', name: 'Administration – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '09:40 - 10:25', period: 'Period 2', name: 'PE Core – 5-14', teacher: 'Mr Fulton', room: 'P/E', type: 'class' },
        { time: '10:25 - 11:10', period: 'Period 3', name: 'Modern Studies – CfE', teacher: 'Mr Kelly', room: 'S23', type: 'class' },
        { time: '11:10 - 11:25', period: 'Break', name: 'Morning Break', teacher: 'Cafeteria', room: 'Break', type: 'break' },
        { time: '11:25 - 12:15', period: 'Period 4', name: 'Mathematics – CfE', teacher: 'Mr McLarty', room: 'F3', type: 'class' },
        { time: '12:15 - 13:05', period: 'Period 5', name: 'RE Core – 5-14', teacher: 'Mr Mackay', room: 'S13', type: 'class' },
        { time: '13:05 - 13:45', period: 'Lunch', name: 'Lunch Break', teacher: 'Dining Hall', room: 'Break', type: 'break' },
        { time: '13:45 - 14:30', period: 'Period 6', name: 'Biology – CfE', teacher: 'Mrs Cullen', room: 'S4', type: 'class' },
        { time: '14:30 - 15:15', period: 'Period 7', name: 'English – CfE', teacher: 'Mr McGeary', room: 'F12', type: 'class' }
      ],
      Thursday: [
        { time: '08:50 - 09:40', period: 'Period 1', name: 'Physical Education – CfE', teacher: 'Mr Fulton', room: 'P/E', type: 'class' },
        { time: '09:40 - 10:25', period: 'Period 2', name: 'English – CfE', teacher: 'Mr McGeary', room: 'F12', type: 'class' },
        { time: '10:25 - 11:10', period: 'Period 3', name: 'Modern Studies – CfE', teacher: 'Mr Kelly', room: 'S23', type: 'class' },
        { time: '11:10 - 11:25', period: 'Break', name: 'Morning Break', teacher: 'Cafeteria', room: 'Break', type: 'break' },
        { time: '11:25 - 12:15', period: 'Period 4', name: 'Biology – CfE', teacher: 'Mrs Cullen', room: 'S4', type: 'class' },
        { time: '12:15 - 13:05', period: 'Period 5', name: 'Mathematics – CfE', teacher: 'Mr McLarty', room: 'F3', type: 'class' },
        { time: '13:05 - 13:45', period: 'Lunch', name: 'Lunch Break', teacher: 'Dining Hall', room: 'Break', type: 'break' },
        { time: '13:45 - 14:30', period: 'Period 6', name: 'Business Management – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '14:30 - 15:15', period: 'Period 7', name: 'Developing the Young Workforce', teacher: 'Ms Johnston', room: 'S20', type: 'class' }
      ],
      Friday: [
        { time: '08:50 - 09:40', period: 'Period 1', name: 'Administration – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '09:40 - 10:25', period: 'Period 2', name: 'Modern Studies – CfE', teacher: 'Mr Kelly', room: 'S23', type: 'class' },
        { time: '10:25 - 11:10', period: 'Period 3', name: 'Mathematics – CfE', teacher: 'Mr McLarty', room: 'F3', type: 'class' },
        { time: '11:10 - 11:25', period: 'Break', name: 'Morning Break', teacher: 'Cafeteria', room: 'Break', type: 'break' },
        { time: '11:25 - 12:15', period: 'Period 4', name: 'Business Management – CfE', teacher: 'Mr McDermott', room: 'F24', type: 'class' },
        { time: '12:15 - 13:05', period: 'Period 5', name: 'English – CfE', teacher: 'Mr McGeary', room: 'F12', type: 'class' },
        { time: '13:05 - 13:45', period: 'Lunch', name: 'Lunch Break', teacher: 'Dining Hall', room: 'Break', type: 'break' },
        { time: '13:45 - 14:30', period: 'Period 6', name: 'Physical Education – CfE', teacher: 'Mr Fulton', room: 'P/E', type: 'class' },
        { time: '14:30 - 15:15', period: 'Period 7', name: 'PE Core – 5-14', teacher: 'Mr McGimpsey', room: 'P/E', type: 'class' }
      ]
    };

    let currentDay = 'Monday';
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    
    const jsDay = new Date().getDay();
    if (jsDay >= 1 && jsDay <= 5) {
      currentDay = days[jsDay - 1];
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.day-tab').forEach(btn => {
        if(btn.id === `tab-${day}`) {
          btn.className = "day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap bg-[#00ffcc] text-black shadow-lg shadow-[#00ffcc]/20";
        } else {
          btn.className = "day-tab px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap glass-pill text-slate-400 hover:text-white";
        }
      });
      renderTimeline(currentDay);
    }

    function renderTimeline(day) {
      const container = document.getElementById('timeline-container');
      document.getElementById('active-day-title').innerText = `${day} Timeline`;
      const list = fullSchedule[day];
      document.getElementById('active-day-count').innerText = `${list.filter(x => x.type === 'class').length} classes scheduled`;
      
      container.innerHTML = '';
      
      list.forEach(item => {
        const isBreak = item.type === 'break';
        const card = document.createElement('div');
        
        if (isBreak) {
          card.className = "glass-vapor rounded-2xl p-3.5 border border-pink-500/30 bg-pink-500/5 flex items-center justify-between";
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-16 py-2 rounded-xl bg-pink-500/20 text-pink-300 border border-pink-500/30 text-center font-mono text-[11px] font-bold">
                ${item.period}
              </div>
              <div>
                <h3 class="text-xs font-bold text-pink-200">${item.name}</h3>
                <p class="text-[10px] text-pink-400/80 mt-0.5">${item.teacher} • ${item.room}</p>
              </div>
            </div>
            <span class="text-[11px] font-mono font-semibold text-pink-300/90">${item.time}</span>
          `;
        } else {
          card.className = "glass-vapor rounded-2xl p-4 flex items-center justify-between transition-all hover:border-[#00ffcc]/40";
          card.innerHTML = `
            <div class="flex items-center gap-3.5">
              <div class="w-16 py-2.5 rounded-xl bg-[#00ffcc]/10 border border-[#00ffcc]/20 text-[#00ffcc] text-center font-mono text-[11px] font-bold shadow-inner">
                ${item.period}
              </div>
              <div>
                <h3 class="text-xs font-bold text-white tracking-wide">${item.name}</h3>
                <p class="text-[11px] text-slate-400 mt-0.5 font-medium">${item.teacher} • <span class="text-[#00ffcc] font-semibold">${item.room}</span></p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-[11px] font-mono font-semibold text-slate-400">${item.time}</span>
            </div>
          `;
        }
        container.appendChild(card);
      });
    }

    function switchView(view) {
      const tBtn = document.getElementById('nav-timetable');
      const bBtn = document.getElementById('nav-bells');
      const container = document.getElementById('timeline-container');
      
      if (view === 'timetable') {
        tBtn.className = "flex flex-col items-center gap-1 text-[#00ffcc] py-1.5 px-6 transition-colors";
        bBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white py-1.5 px-6 transition-colors";
        renderTimeline(currentDay);
      } else {
        bBtn.className = "flex flex-col items-center gap-1 text-[#00ffcc] py-1.5 px-6 transition-colors";
        tBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white py-1.5 px-6 transition-colors";
        document.getElementById('active-day-title').innerText = "Bell Schedule";
        document.getElementById('active-day-count').innerText = "Daily standard times";
        
        const bells = [
          { period: 'Period 1', time: '08:50 - 09:40' },
          { period: 'Period 2', time: '09:40 - 10:25' },
          { period: 'Period 3', time: '10:25 - 11:10' },
          { period: 'Break', time: '11:10 - 11:25' },
          { period: 'Period 4', time: '11:25 - 12:15' },
          { period: 'Period 5', time: '12:15 - 13:05' },
          { period: 'Lunch', time: '13:05 - 13:45' },
          { period: 'Period 6', time: '13:45 - 14:30' },
          { period: 'Period 7', time: '14:30 - 15:15' }
        ];
        
        container.innerHTML = '';
        bells.forEach(b => {
          const card = document.createElement('div');
          card.className = "glass-vapor rounded-2xl p-4 flex items-center justify-between";
          card.innerHTML = `
            <span class="text-xs font-bold text-white">${b.period}</span>
            <span class="text-xs font-mono font-semibold text-[#00ffcc]">${b.time}</span>
          `;
          container.appendChild(card);
        });
      }
    }

    // Real-time clock and live period countdown engine
    function updateLiveTimings() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('header-clock').innerText = timeString;

      const currentDayIndex = now.getDay();
      const titleEl = document.getElementById('current-class-title');
      const countdownEl = document.getElementById('period-countdown');
      const badgeEl = document.getElementById('status-badge');

      if (currentDayIndex < 1 || currentDayIndex > 5) {
        badgeEl.innerText = "WEEKEND";
        titleEl.innerText = "No classes today. Enjoy your break!";
        countdownEl.innerText = "FREE";
        return;
      }

      const todayName = days[currentDayIndex - 1];
      const scheduleList = fullSchedule[todayName];
      
      const currentTimeInMins = hours * 60 + minutes;
      let activeItem = null;
      let nextItem = null;

      for (let i = 0; i < scheduleList.length; i++) {
        const item = scheduleList[i];
        const [startStr, endStr] = item.time.split(' - ');
        const [sh, sm] = startStr.split(':').map(Number);
        const [eh, em] = endStr.split(':').map(Number);
        const startTotal = sh * 60 + sm;
        const endTotal = eh * 60 + em;

        if (currentTimeInMins >= startTotal && currentTimeInMins < endTotal) {
          activeItem = { item, endTotal };
          break;
        } else if (currentTimeInMins < startTotal) {
          nextItem = item;
          break;
        }
      }

      if (activeItem) {
        badgeEl.innerText = `NOW (${activeItem.item.period})`;
        titleEl.innerText = `${activeItem.item.name} (${activeItem.item.room})`;
        
        const endTimeParts = activeItem.item.time.split(' - ')[1].split(':').map(Number);
        const endTotalSecs = endTimeParts[0] * 3600 + endTimeParts[1] * 60;
        const currentTotalSecs = hours * 3600 + minutes * 60 + seconds;
        const diffSecs = endTotalSecs - currentTotalSecs;

        if (diffSecs > 0) {
          const remMins = Math.floor(diffSecs / 60);
          const remSecs = diffSecs % 60;
          countdownEl.innerText = `${remMins.toString().padStart(2, '0')}m ${remSecs.toString().padStart(2, '0')}s left`;
        } else {
          countdownEl.innerText = "Ending...";
        }
      } else if (nextItem) {
        badgeEl.innerText = "UPCOMING";
        titleEl.innerText = `Next: ${nextItem.name} at ${nextItem.time.split(' - ')[0]}`;
        countdownEl.innerText = "Waiting";
      } else {
        badgeEl.innerText = "FINISHED";
        titleEl.innerText = "All school periods completed for today!";
        countdownEl.innerText = "00:00";
      }
    }

    switchDay(currentDay);
    setInterval(updateLiveTimings, 1000);
    updateLiveTimings();
  </script>
</body>
</html>
